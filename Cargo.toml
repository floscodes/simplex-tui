[package]
name = "simplex-tui"
version = "0.1.0"
description = "TUI for simplex-chat"
authors = ["floscodes <mail@floscodes.net>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.32"
ratatui = "0.30.2"
tui-qrcode = "0.2.6"
qrcode = { version = "0.14.1", default-features = false }
tokio = { version = "1.52.3", features = ["full"] }
color-eyre = "0.6.5"
directories = "6.0.0"
libc = "0.2.177"
libloading = "0.8.9"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"

[dev-dependencies]
tempfile = "3.23.0"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
