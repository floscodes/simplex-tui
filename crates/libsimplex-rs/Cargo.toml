[package]
name = "libsimplex-rs"
version = "0.1.3"
description = "Safe Rust client wrapper for the official SimpleX Chat library"
readme = "README.md"
repository = "https://github.com/floscodes/simplex-tui"
homepage = "https://github.com/floscodes/simplex-tui"
documentation = "https://docs.rs/libsimplex-rs"
keywords = ["simplex", "chat", "messaging", "ffi", "wrapper"]
categories = ["api-bindings", "network-programming"]
rust-version = "1.85"
edition.workspace = true
license.workspace = true
authors.workspace = true
include = ["src/**", "Cargo.toml", "README.md"]

[dependencies]
libc = "0.2.177"
libloading = "0.8.9"
crypto_secretbox = { version = "0.1.1", features = ["salsa20"] }
hkdf = "0.12.4"
openssl = "0.10.73"
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"

[dev-dependencies]
tempfile = "3.23.0"
