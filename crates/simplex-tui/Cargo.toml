[package]
name = "simplex-tui"
version = "0.1.3"
description = "Terminal client for SimpleX Chat"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
build = "build.rs"

[dependencies]
libsimplex-rs = { path = "../libsimplex-rs" }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.32"
ratatui = "0.30.2"
tui-qrcode = "0.2.6"
qrcode = { version = "0.14.1", default-features = false }
tokio = { version = "1.52.3", features = ["full"] }
color-eyre = "0.6.5"
directories = "6.0.0"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.23.0"
